<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Citizenry — Asset Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Overpass:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F2EEE3; --ink:#211F1A; --ink-soft:#6E6A5E; --line:#DCD6C7; --accent:#C08A2E;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:'Overpass',sans-serif;}
  a{color:inherit;text-decoration:none;}
  .wrap{max-width:640px;margin:0 auto;padding:56px 28px 100px;}
  .crumb{font-size:13px;color:var(--ink-soft);margin:0 0 22px;}
  .crumb a{border-bottom:1px solid var(--line);}
  .crumb a:hover{border-color:var(--ink-soft);}
  .titleRow{display:flex;align-items:center;gap:12px;margin:0 0 6px;}
  .chip{width:13px;height:13px;border-radius:50%;background:var(--accent);flex:none;}
  h1{font-family:'Fraunces',serif;font-weight:500;font-size:38px;line-height:1.05;letter-spacing:-0.01em;margin:0;}
  .lede{font-size:15px;color:var(--ink-soft);line-height:1.6;max-width:42ch;margin:14px 0 48px;padding-left:25px;}

  .projects{display:flex;flex-direction:column;}
  .project{display:flex;align-items:baseline;gap:16px;padding:20px 0;border-top:1px solid var(--line);}
  .projects .project:last-child{border-bottom:1px solid var(--line);}
  .project-main{flex:1;min-width:0;}
  .project-code{font-size:12px;color:var(--accent);font-weight:600;margin-bottom:2px;}
  .project-name{font-family:'Fraunces',serif;font-weight:500;font-size:20px;}
  .project:hover .project-name{opacity:0.6;}
  .project-desc{font-size:13px;color:var(--ink-soft);margin-top:3px;}
  .project-status{font-size:13px;color:var(--ink);white-space:nowrap;flex:none;}

  .emptyState{
    padding:28px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);
    font-size:14px;color:var(--ink-soft);
  }

  @media (max-width:480px){
    .wrap{padding:40px 20px 70px;}
    h1{font-size:30px;}
    .lede{padding-left:0;}
    .project{flex-wrap:wrap;}
    .project-status{width:100%;}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="crumb"><a href="../">Asset Review</a> / The Citizenry</div>
  <div class="titleRow">
    <span class="chip"></span>
    <h1>The Citizenry</h1>
  </div>
  <p class="lede">Global artisan-made home goods.</p>
  <div class="emptyState">No active projects yet for The Citizenry.</div>
</div>
</body>
</html>
