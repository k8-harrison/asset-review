<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Citizenry — Asset Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F3EC; --paper-dim:#EDE9DD; --ink:#2B2B24; --ink-soft:#6B6858;
    --line:#D9D4C4; --card:#FFFFFF; --accent:#3A5A78;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:'Overpass',sans-serif;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  a{color:inherit;}
  .masthead{background:var(--ink);color:var(--paper);padding:0;position:relative;overflow:hidden;}
  .ticks{display:flex;justify-content:space-between;padding:0 18px;border-bottom:1px solid rgba(246,243,234,0.15);}
  .ticks span{width:1px;height:9px;background:rgba(246,243,234,0.25);display:block;}
  .masthead-inner{padding:36px 24px 30px;max-width:1040px;margin:0 auto;}
  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#B7B29B;margin-bottom:10px;}
  .eyebrow a{color:#B7B29B;text-decoration:none;}
  .eyebrow a:hover{color:var(--paper);text-decoration:underline;}
  .eyebrow b{color:var(--paper);font-weight:600;}
  h1{font-size:30px;font-weight:800;margin:0 0 6px;letter-spacing:-0.01em;}
  .masthead p{margin:0;color:#B7B29B;font-size:14px;max-width:560px;line-height:1.5;}
  .wrap{max-width:1040px;margin:0 auto;padding:34px 24px 80px;}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:10px;
    padding:18px 18px 16px;position:relative;overflow:hidden;
    text-decoration:none;display:block;transition:border-color .15s, transform .15s;
  }
  .card:hover{border-color:var(--ink-soft);transform:translateY(-1px);}
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent);}
  .code{
    font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;letter-spacing:.05em;
    color:var(--accent);background:color-mix(in srgb, var(--accent) 12%, transparent);
    display:inline-block;padding:3px 8px;border-radius:5px;margin-bottom:10px;
  }
  .card h3{font-size:17px;font-weight:700;margin:0 0 4px;line-height:1.3;}
  .card .meta{font-size:12.5px;color:var(--ink-soft);margin-bottom:14px;}
  .card .foot{
    display:flex;align-items:center;justify-content:space-between;
    font-size:12px;color:var(--ink-soft);border-top:1px solid var(--line);padding-top:12px;
  }
  .card .open{font-weight:600;color:var(--ink);}
  .card .open::after{content:" →";}
  .emptyNote{
    font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);
    border:1px dashed var(--line);border-radius:10px;padding:16px 18px;
  }
  @media (max-width:520px){
    .masthead-inner{padding:28px 18px 24px;}
    h1{font-size:24px;}
    .wrap{padding:26px 18px 60px;}
  }
</style>
</head>
<body>
<div class="masthead">
  <div class="ticks" id="ticks"></div>
  <div class="masthead-inner">
    <div class="eyebrow"><a href="../">&larr; All Brands</a> &nbsp;·&nbsp; <b>The Citizenry</b></div>
    <h1>The Citizenry</h1>
    <p>Global artisan-made home goods.</p>
  </div>
</div>
<div class="wrap">
    <div class="emptyNote">No active projects yet for The Citizenry.</div>
</div>
<script>
(function(){
  const el = document.getElementById('ticks');
  el.innerHTML = Array.from({length:40}, ()=>'<span></span>').join('');
  el.style.padding = '10px 18px';
})();
</script>
</body>
</html>
