<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>26JUL BUR CHI - Round 3 Edits (Ludlow Sofa)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<style>
  :root{
    --paper:#F6F3EC; --paper-dim:#EDE9DD; --ink:#2B2B24; --ink-soft:#6B6858;
    --moss:#94944D; --moss-dark:#6E6E39; --line:#D9D4C4; --card:#FFFFFF; --r2:#8A5A3B;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:'Overpass',sans-serif;}
  .mono{font-family:'IBM Plex Mono',monospace;}

  #nameGate{position:fixed;inset:0;background:rgba(43,43,36,0.55);display:flex;align-items:center;justify-content:center;z-index:200;}
  #nameGate.hidden{display:none;}
  .gateCard{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:32px 36px;width:340px;max-width:90vw;box-shadow:0 12px 40px rgba(0,0,0,0.25);}
  .gateCard h2{margin:0 0 6px;font-size:19px;font-weight:600;}
  .gateCard p{margin:0 0 18px;font-size:13px;color:var(--ink-soft);line-height:1.5;}
  .gateCard input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:3px;font-family:'Overpass',sans-serif;font-size:14px;margin-bottom:14px;background:var(--paper);}
  .gateCard input:focus{outline:none;border-color:var(--r2);}
  .gateCard button{width:100%;padding:10px 12px;border:none;border-radius:3px;background:var(--r2);color:#fff;font-size:14px;font-weight:600;cursor:pointer;font-family:'Overpass',sans-serif;}
  .googleBtn{display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;color:var(--ink);border:1px solid var(--line);}
  .googleBtn:hover{background:#F7F7F7;}
  #signInError{margin-top:12px;font-size:12px;color:#B3261E;background:#FCE8E6;padding:10px 12px;border-radius:3px;line-height:1.5;}

  header{position:sticky;top:0;z-index:50;background:var(--paper);border-bottom:2px solid var(--r2);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
  .r2Badge{display:inline-block;background:var(--r2);color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:3px;letter-spacing:0.4px;margin-right:8px;vertical-align:middle;}
  .titleBlock h1{font-size:16px;margin:0;font-weight:700;letter-spacing:0.2px;display:flex;align-items:center;}
  .titleBlock .sub{font-size:11px;color:var(--ink-soft);margin-top:4px;}
  .whoami{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-soft);cursor:pointer;padding:6px 10px;border:1px solid var(--line);border-radius:4px;background:var(--card);}
  .whoami .dot{width:8px;height:8px;border-radius:50%;background:var(--r2);}
  .whoami b{color:var(--ink);}
  .backLink{font-size:12px;color:var(--ink-soft);text-decoration:none;border:1px solid var(--line);padding:6px 10px;border-radius:4px;background:var(--card);}
  .backLink:hover{border-color:var(--r2);color:var(--r2);}

  main{padding:20px 24px 60px;}
  #grid{display:flex;flex-wrap:wrap;gap:16px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:4px;overflow:hidden;width:220px;transition:box-shadow .15s ease;}
  .card:hover{box-shadow:0 6px 18px rgba(0,0,0,0.12);}
  .card.approved{box-shadow:0 0 0 2px var(--r2) inset;}
  .imgArea{position:relative;height:230px;background:var(--paper-dim);display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;}
  .imgArea img{width:100%;height:100%;object-fit:contain;display:block;}
  .stateLabel{position:absolute;top:6px;left:6px;font-size:10px;font-weight:700;padding:3px 7px;border-radius:3px;color:#fff;letter-spacing:0.3px;z-index:2;}
  .stateLabel.edit{background:var(--r2);}
  .stateLabel.original{background:rgba(43,43,36,0.65);}
  .toggleBtn{
    position:absolute;bottom:6px;right:6px;background:rgba(255,255,255,0.95);border:1px solid var(--line);
    border-radius:20px;padding:5px 10px;font-size:10px;font-weight:700;cursor:pointer;color:var(--ink);
    font-family:'Overpass',sans-serif;z-index:2;
  }
  .toggleBtn:hover{border-color:var(--r2);color:var(--r2);}
  .checkBadge{
    position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;
    background:rgba(43,43,36,0.55);color:#fff;display:flex;align-items:center;justify-content:center;
    font-size:13px;cursor:pointer;z-index:2;
  }
  .card.approved .checkBadge{background:var(--r2);}
  .cardFooter{padding:8px 10px;}
  .cardFooter .fname{font-size:11px;font-weight:700;word-break:break-all;}
  .commentCount{font-size:10px;color:var(--ink-soft);margin-top:2px;}
  .approvedCount{font-size:12px;color:var(--ink-soft);}

  /* lightbox */
  #lightbox{position:fixed;inset:0;background:rgba(20,19,15,0.92);display:none;align-items:center;justify-content:center;z-index:150;padding:30px;}
  #lightbox.open{display:flex;}
  #lbImageArea{position:relative;display:flex;align-items:center;justify-content:center;flex:1;min-width:0;}
  #lightbox img{max-width:min(75vw,650px);max-height:74vh;object-fit:contain;border-radius:2px;box-shadow:0 20px 60px rgba(0,0,0,0.5);}
  #lbStateLabel{position:absolute;top:0;left:0;font-size:11px;font-weight:700;padding:4px 10px;border-radius:3px;color:#fff;letter-spacing:0.3px;}
  #lbStateLabel.edit{background:var(--r2);}
  #lbStateLabel.original{background:rgba(43,43,36,0.7);}
  #lbToggleBtn{
    position:absolute;bottom:0;left:50%;transform:translateX(-50%);background:rgba(255,255,255,0.95);
    border:1px solid var(--line);border-radius:20px;padding:8px 18px;font-size:12px;font-weight:700;
    cursor:pointer;color:var(--ink);font-family:'Overpass',sans-serif;
  }
  #lbToggleBtn:hover{border-color:var(--r2);color:var(--r2);}
  #lightboxPanel{background:var(--card);border-radius:4px;padding:20px;width:280px;margin-left:20px;flex-shrink:0;max-height:88vh;overflow-y:auto;}
  #lightboxPanel .fname{font-size:13px;font-weight:700;margin-bottom:16px;}
  #lbApproveBtn{
    width:100%;padding:10px;border:1px solid var(--r2);border-radius:3px;background:transparent;
    color:var(--r2);font-weight:700;font-size:13px;cursor:pointer;margin-bottom:16px;font-family:'Overpass',sans-serif;
  }
  #lbApproveBtn.active{background:var(--r2);color:#fff;}
  .commentsHeading{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.4px;color:var(--ink-soft);margin-bottom:8px;}
  #lbComments{max-height:180px;overflow-y:auto;margin-bottom:10px;display:flex;flex-direction:column;gap:10px;}
  .commentItem{font-size:12px;line-height:1.5;border-bottom:1px solid var(--line);padding-bottom:8px;}
  .commentItem .cName{font-weight:700;color:var(--ink);}
  .commentItem .cTime{font-size:10px;color:var(--ink-soft);margin-left:6px;}
  .commentItem .cText{color:var(--ink);margin-top:2px;}
  #noComments{font-size:12px;color:var(--ink-soft);margin-bottom:10px;}
  #lbCommentInput{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:3px;font-family:'Overpass',sans-serif;font-size:12px;background:var(--paper);resize:vertical;min-height:52px;margin-bottom:8px;}
  #lbCommentInput:focus{outline:none;border-color:var(--r2);}
  #lbCommentSubmit{width:100%;padding:9px;border:none;border-radius:3px;background:var(--r2);color:#fff;font-size:12px;font-weight:700;cursor:pointer;font-family:'Overpass',sans-serif;}
  #closeLightbox{position:absolute;top:20px;right:26px;color:#fff;font-size:26px;cursor:pointer;line-height:1;}
  #lbNavPrev,#lbNavNext{position:absolute;top:50%;transform:translateY(-50%);color:#fff;font-size:34px;cursor:pointer;padding:10px;user-select:none;opacity:0.7;z-index:2;}
  #lbNavPrev:hover,#lbNavNext:hover{opacity:1;}
  #lbNavPrev{left:0;}
  #lbNavNext{right:0;}
  @media (max-width:800px){
    #lightbox{flex-direction:column;padding:14px;}
    #lightboxPanel{margin-left:0;margin-top:14px;width:100%;max-width:400px;}
  }
</style>
</head>
<body>

<div id="nameGate">
  <div class="gateCard">
    <h2>Sign in to review</h2>
    <p>Havenly team members only. Your name and email are attached to every approval and comment.</p>
    <button id="googleSignInBtn" class="googleBtn">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l6-6C34.5 5.1 29.5 3 24 3 12.4 3 3 12.4 3 24s9.4 21 21 21 21-9.4 21-21c0-1.4-.1-2.7-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.5 18.9 12 24 12c3.1 0 5.8 1.1 8 3l6-6C34.5 5.1 29.5 3 24 3c-7.8 0-14.5 4.4-17.7 11.7z"/><path fill="#4CAF50" d="M24 45c5.4 0 10.3-1.9 14-5.2l-6.5-5.5c-2 1.4-4.6 2.2-7.5 2.2-5.3 0-9.7-3.3-11.3-8l-6.5 5C9.5 40.5 16.2 45 24 45z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.2-4.2 5.6l6.5 5.5C41.4 36 45 30.5 45 24c0-1.4-.1-2.7-.4-3.5z"/></svg>
      Sign in with Google
    </button>
    <div id="signInError" style="display:none;"></div>
  </div>
</div>

<header>
  <div class="titleBlock">
    <h1><span class="r2Badge">R3</span>26JUL BUR CHI — Round 3 Edits</h1>
    <div class="sub">Ludlow sofa · <span id="approvedCount">0</span> of 21 approved · comparing R2 → R3 · click a photo to expand</div>
  </div>
  <div style="display:flex;gap:10px;align-items:center;">
    <a class="backLink" href="../r2/">&larr; R2</a>
    <a class="backLink" href="../">Main review</a>
    <div class="whoami" id="whoami"><span class="dot"></span><b id="meName">—</b></div>
  </div>
</header>

<main>
  <div id="grid"></div>
</main>

<div id="lightbox">
  <span id="closeLightbox">&times;</span>
  <div id="lbImageArea">
    <span id="lbNavPrev">&#8249;</span>
    <div id="lbStateLabel" class="edit">R3 EDIT</div>
    <img id="lightboxImg" src="">
    <button id="lbToggleBtn">Show R2 edit</button>
    <span id="lbNavNext">&#8250;</span>
  </div>
  <div id="lightboxPanel">
    <div class="fname mono" id="lbFname"></div>
    <button id="lbApproveBtn">Approve this edit</button>
    <div class="commentsHeading">Feedback</div>
    <div id="lbComments"></div>
    <div id="noComments" style="display:none;">No comments yet.</div>
    <textarea id="lbCommentInput" placeholder="Add feedback on this edit..."></textarea>
    <button id="lbCommentSubmit">Post comment</button>
  </div>
</div>

<script>
const FILES = ["530A6427.jpg", "530A6439.jpg", "530A6450.jpg", "530A6464.jpg", "530A6485.jpg", "530A6551.jpg", "530A6576.jpg", "530A6588.jpg", "530A6602.jpg", "530A6634.jpg", "530A6641.jpg", "530A6645.jpg", "530A6670.jpg", "530A6714.jpg", "530A6740.jpg", "530A6741.jpg", "530A6744.jpg", "530A6746.jpg", "530A6750.jpg", "530A6755.jpg", "530A6758.jpg"];

const FIREBASE_URL = 'https://asset-review-8bfb6-default-rtdb.firebaseio.com';
const SLACK_WEBHOOK_URL = 'https://hooks.slack.com/services/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';

async function notifySlack(text){
  try{
    await fetch(SLACK_WEBHOOK_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'application/x-www-form-urlencoded'},
      body: 'payload=' + encodeURIComponent(JSON.stringify({text}))
    });
  }catch(e){ console.error('slack notify failed', e); }
}
let myName = null;
let approvedSet = new Set();
let commentsByFile = {};
let cardState = {}; // file -> 'edit' | 'original'  (grid card state)
let lbIndex = -1;
let lbState = 'edit'; // lightbox's own toggle state

const ALLOWED_DOMAIN = 'havenly.com';

const firebaseApp = firebase.initializeApp({
  apiKey: "AIzaSyCruCqUQi5HpPAroRTXs6Xxd-Ajf9ASB-o",
  authDomain: "asset-review-8bfb6.firebaseapp.com",
  databaseURL: "https://asset-review-8bfb6-default-rtdb.firebaseio.com",
  projectId: "asset-review-8bfb6",
  storageBucket: "asset-review-8bfb6.firebasestorage.app",
  messagingSenderId: "895411644257",
  appId: "1:895411644257:web:e5444ace279d996a258720"
});
const auth = firebase.auth();
const googleProvider = new firebase.auth.GoogleAuthProvider();
googleProvider.setCustomParameters({ hd: ALLOWED_DOMAIN });

function showSignInError(msg){
  const el = document.getElementById('signInError');
  el.textContent = msg;
  el.style.display = 'block';
}
function clearSignInError(){
  document.getElementById('signInError').style.display = 'none';
}

async function handleSignedInUser(user){
  const email = user.email || '';
  if(!email.toLowerCase().endsWith('@' + ALLOWED_DOMAIN)){
    showSignInError('Please sign in with your @' + ALLOWED_DOMAIN + ' email. Signed-in account: ' + email);
    await auth.signOut();
    return false;
  }
  clearSignInError();
  myName = user.displayName || email.split('@')[0];
  document.getElementById('nameGate').classList.add('hidden');
  document.getElementById('meName').textContent = myName;
  return true;
}

async function getAuthToken(){
  const user = auth.currentUser;
  if(!user) return null;
  try{ return await user.getIdToken(); }catch(e){ return null; }
}

async function fbGet(path){
  try{
    const token = await getAuthToken();
    const url = FIREBASE_URL + '/' + path + '.json' + (token ? '?auth=' + token : '');
    const r = await fetch(url);
    if(!r.ok){
      console.error('firebase get failed', r.status, await r.text().catch(()=>''));
      return null;
    }
    return await r.json();
  }catch(e){ console.error('firebase get failed', e); return null; }
}
async function fbSet(path, value){
  try{
    const token = await getAuthToken();
    const url = FIREBASE_URL + '/' + path + '.json' + (token ? '?auth=' + token : '');
    const r = await fetch(url, {method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(value)});
    if(!r.ok){
      const errText = await r.text().catch(()=>'');
      console.error('firebase set failed', r.status, errText);
      alert('Could not save — ' + (r.status === 401 || r.status === 403 ? 'you may need to sign in again.' : 'something went wrong (status ' + r.status + ').'));
      return false;
    }
    return true;
  }catch(e){
    console.error('firebase set failed', e);
    alert('Could not save — check your connection and try again.');
    return false;
  }
}

function escapeHtml(s){ const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function fKey(file){ return file.replace(/[.#$\[\]\/]/g, '_'); }
function frameLabel(file){
  const m = file.match(/(\d{3,4})(?:-\d+)?(?:\.jpg)?$/i);
  return m ? m[1] : file;
}
function timeAgo(ts){
  const s = Math.floor((Date.now() - ts) / 1000);
  if(s < 60) return 'just now';
  const m = Math.floor(s/60); if(m < 60) return m + 'm ago';
  const h = Math.floor(m/60); if(h < 24) return h + 'h ago';
  return Math.floor(h/24) + 'd ago';
}

async function init(){
  FILES.forEach(f => cardState[f] = 'edit');

  document.getElementById('googleSignInBtn').addEventListener('click', async ()=>{
    clearSignInError();
    try{
      await auth.signInWithPopup(googleProvider);
    }catch(e){
      if(e.code !== 'auth/popup-closed-by-user'){
        showSignInError('Sign-in failed: ' + (e.message || e.code));
      }
    }
  });
  document.getElementById('whoami').addEventListener('click', ()=>{
    if(confirm('Sign out of the R2 review?')){
      auth.signOut();
    }
  });

  auth.onAuthStateChanged(async user=>{
    if(user){
      await handleSignedInUser(user);
    }else{
      myName = null;
      document.getElementById('nameGate').classList.remove('hidden');
      document.getElementById('meName').textContent = '—';
    }
  });

  document.getElementById('closeLightbox').addEventListener('click', closeLightbox);
  document.getElementById('lightbox').addEventListener('click', e=>{ if(e.target.id==='lightbox') closeLightbox(); });
  document.getElementById('lbNavPrev').addEventListener('click', ()=>navLightbox(-1));
  document.getElementById('lbNavNext').addEventListener('click', ()=>navLightbox(1));
  document.getElementById('lbToggleBtn').addEventListener('click', ()=>{
    lbState = lbState === 'edit' ? 'original' : 'edit';
    updateLightboxImage();
  });
  document.getElementById('lbApproveBtn').addEventListener('click', ()=>{
    const file = FILES[lbIndex];
    toggleApprove(file, true);
  });
  document.getElementById('lbCommentSubmit').addEventListener('click', postComment);
  document.addEventListener('keydown', e=>{
    if(!document.getElementById('lightbox').classList.contains('open')) return;
    if(e.key==='Escape') closeLightbox();
    if(e.key==='ArrowLeft') navLightbox(-1);
    if(e.key==='ArrowRight') navLightbox(1);
  });

  startApp();
}

async function startApp(){
  const approvedData = await fbGet('r3_approved');
  approvedSet = new Set(approvedData || []);
  const commentsData = await fbGet('r3_comments');
  commentsByFile = commentsData || {};
  render();
}

function render(){
  document.getElementById('approvedCount').textContent = approvedSet.size;
  const grid = document.getElementById('grid');
  grid.innerHTML = FILES.map((file, i)=>{
    const isApproved = approvedSet.has(file);
    const state = cardState[file];
    const src = state === 'edit' ? ('images/thumb/' + file) : ('../r2/images/thumb/' + file);
    const commentCount = (commentsByFile[fKey(file)] || []).length;
    return `
    <div class="card ${isApproved?'approved':''}" data-idx="${i}">
      <div class="imgArea" data-action="view">
        <div class="stateLabel ${state}">${state === 'edit' ? 'R3 EDIT' : 'R2 EDIT'}</div>
        <button class="checkBadge" data-action="approve" title="${isApproved?'Remove approval':'Approve this edit'}">${isApproved ? '&#10003;' : ''}</button>
        <img src="${src}">
        <button class="toggleBtn" data-action="toggle">Show ${state === 'edit' ? 'R2 edit' : 'R3 edit'}</button>
      </div>
      <div class="cardFooter">
        <div class="fname mono">${frameLabel(file)}</div>
        ${commentCount ? `<div class="commentCount">&#128172; ${commentCount} comment${commentCount>1?'s':''}</div>` : ''}
      </div>
    </div>`;
  }).join('');

  grid.querySelectorAll('.card').forEach(card=>{
    const idx = parseInt(card.dataset.idx);
    const file = FILES[idx];
    card.querySelector('[data-action="view"]').addEventListener('click', ()=>openLightbox(idx));
    card.querySelector('[data-action="toggle"]').addEventListener('click', e=>{
      e.stopPropagation();
      cardState[file] = cardState[file] === 'edit' ? 'original' : 'edit';
      render();
    });
    card.querySelector('[data-action="approve"]').addEventListener('click', e=>{
      e.stopPropagation();
      toggleApprove(file, false);
    });
  });
}

async function toggleApprove(file, fromLightbox){
  if(!myName){
    document.getElementById('nameGate').classList.remove('hidden');
    return;
  }
  if(approvedSet.has(file)) approvedSet.delete(file); else approvedSet.add(file);
  await fbSet('r3_approved', Array.from(approvedSet));
  render();
  if(fromLightbox) updateLightboxPanel();
}

/* ====== LIGHTBOX ====== */
function openLightbox(idx){
  lbIndex = idx;
  lbState = cardState[FILES[idx]] || 'edit';
  document.getElementById('lightbox').classList.add('open');
  updateLightboxImage();
  updateLightboxPanel();
}
function updateLightboxImage(){
  const file = FILES[lbIndex];
  const src = lbState === 'edit' ? ('images/full/' + file) : ('../r2/images/full/' + file);
  document.getElementById('lightboxImg').src = src;
  const label = document.getElementById('lbStateLabel');
  label.textContent = lbState === 'edit' ? 'R3 EDIT' : 'R2 EDIT';
  label.className = lbState;
  document.getElementById('lbToggleBtn').textContent = 'Show ' + (lbState === 'edit' ? 'R2 edit' : 'R3 edit');
}
function updateLightboxPanel(){
  const file = FILES[lbIndex];
  if(!file) return;
  document.getElementById('lbFname').textContent = file;
  const isApproved = approvedSet.has(file);
  const btn = document.getElementById('lbApproveBtn');
  btn.textContent = isApproved ? 'Approved — remove' : 'Approve this edit';
  btn.classList.toggle('active', isApproved);
  renderComments(file);
}
function renderComments(file){
  const arr = commentsByFile[fKey(file)] || [];
  const list = document.getElementById('lbComments');
  const empty = document.getElementById('noComments');
  if(arr.length === 0){
    list.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';
  list.innerHTML = arr.map((c,i)=>`
    <div class="commentItem">
      <span class="cName">${escapeHtml(c.name)}</span><span class="cTime">${timeAgo(c.ts)}</span>
      ${myName === c.name ? `<span class="cDelete" data-idx="${i}" style="float:right;font-size:10px;color:var(--ink-soft);cursor:pointer;text-decoration:underline;">Delete</span>` : ''}
      <div class="cText">${escapeHtml(c.text)}</div>
    </div>`).join('');
  list.querySelectorAll('.cDelete').forEach(btn=>{
    btn.addEventListener('click', ()=>deleteComment(file, parseInt(btn.dataset.idx)));
  });
}
async function postComment(){
  if(!myName){
    document.getElementById('nameGate').classList.remove('hidden');
    return;
  }
  const input = document.getElementById('lbCommentInput');
  const text = input.value.trim();
  if(!text) return;
  const file = FILES[lbIndex];
  if(!file) return;
  const arr = commentsByFile[fKey(file)] || [];
  arr.push({name: myName, text, ts: Date.now()});
  const ok = await fbSet('r3_comments/' + fKey(file), arr);
  if(!ok) return;
  commentsByFile[fKey(file)] = arr;
  notifySlack('💬 *' + myName + '* commented on R3 edit `' + file + '`: "' + text + '"\n<https://k8-harrison.github.io/asset-review/r3/|Open R3 review>');
  input.value = '';
  renderComments(file);
  render();
}
async function deleteComment(file, idx){
  const arr = commentsByFile[fKey(file)] || [];
  arr.splice(idx, 1);
  commentsByFile[fKey(file)] = arr;
  await fbSet('r3_comments/' + fKey(file), arr);
  renderComments(file);
  render();
}
function navLightbox(dir){
  let next = lbIndex + dir;
  if(next < 0) next = FILES.length - 1;
  if(next >= FILES.length) next = 0;
  openLightbox(next);
}
function closeLightbox(){
  document.getElementById('lightbox').classList.remove('open');
}

init();
</script>
