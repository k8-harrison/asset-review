<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Havenly Brands — Shoot Directory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F3EC;
    --paper-dim:#EDE9DD;
    --ink:#2B2B24;
    --ink-soft:#6B6858;
    --line:#D9D4C4;
    --card:#FFFFFF;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:'Overpass',sans-serif;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  a{color:inherit;}

  /* ---- masthead: a film-leader strip, echoing the frame-number badges used on every shoot page ---- */
  .masthead{
    background:var(--ink);color:var(--paper);
    padding:0;position:relative;overflow:hidden;
  }
  .ticks{
    display:flex;justify-content:space-between;padding:0 18px;
    border-bottom:1px solid rgba(246,243,234,0.15);
  }
  .ticks span{
    width:1px;height:9px;background:rgba(246,243,234,0.25);display:block;
  }
  .masthead-inner{
    padding:36px 24px 30px;max-width:1040px;margin:0 auto;
  }
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;
    text-transform:uppercase;color:#B7B29B;margin-bottom:10px;
  }
  .eyebrow b{color:var(--paper);font-weight:600;}
  h1{
    font-size:30px;font-weight:800;margin:0 0 6px;letter-spacing:-0.01em;
  }
  .masthead p{
    margin:0;color:#B7B29B;font-size:14px;max-width:560px;line-height:1.5;
  }

  /* ---- body ---- */
  .wrap{max-width:1040px;margin:0 auto;padding:34px 24px 80px;}
  .brandGroup{margin-bottom:36px;}
  .brandGroup:last-child{margin-bottom:0;}
  .brandLabel{
    display:flex;align-items:center;gap:10px;margin-bottom:14px;
  }
  .brandDot{width:9px;height:9px;border-radius:50%;flex:none;}
  .brandLabel h2{
    font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    color:var(--ink-soft);margin:0;
  }
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;}

  .card{
    background:var(--card);border:1px solid var(--line);border-radius:10px;
    padding:18px 18px 16px;position:relative;overflow:hidden;
    text-decoration:none;display:block;transition:border-color .15s, transform .15s;
  }
  .card:hover{border-color:var(--ink-soft);transform:translateY(-1px);}
  .card:focus-visible{outline:2px solid var(--ink);outline-offset:2px;}
  .card::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:4px;
    background:var(--accent, var(--ink-soft));
  }
  .code{
    font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;
    letter-spacing:.05em;color:var(--accent, var(--ink-soft));
    background:color-mix(in srgb, var(--accent, var(--ink-soft)) 12%, transparent);
    display:inline-block;padding:3px 8px;border-radius:5px;margin-bottom:10px;
  }
  .card h3{font-size:17px;font-weight:700;margin:0 0 4px;line-height:1.3;}
  .card .meta{font-size:12.5px;color:var(--ink-soft);margin-bottom:14px;}
  .card .foot{
    display:flex;align-items:center;justify-content:space-between;
    font-size:12px;color:var(--ink-soft);border-top:1px solid var(--line);padding-top:12px;
  }
  .card .open{font-weight:600;color:var(--ink);}
  .card .open::after{content:" →";}

  .emptyNote{
    font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);
    border:1px dashed var(--line);border-radius:10px;padding:16px 18px;
  }

  @media (max-width:520px){
    .masthead-inner{padding:28px 18px 24px;}
    h1{font-size:24px;}
    .wrap{padding:26px 18px 60px;}
  }
</style>
</head>
<body>

<div class="masthead">
  <div class="ticks" id="ticks"></div>
  <div class="masthead-inner">
    <div class="eyebrow"><b>Havenly Brands</b> · Production Archive</div>
    <h1>Shoot Directory</h1>
    <p>Every active and past photo/video shoot across the portfolio, in one place. Pick a shoot to review selects, edits, and finals.</p>
  </div>
</div>

<div class="wrap" id="wrap"></div>

<script>
/* ============================================================
   SHOOTS — add a new shoot by adding one object to this array.
   brand      : brand name, used to group cards
   accent     : hex color for that brand's left-edge tab + code chip
   code       : short shoot code (shown as a mono badge)
   title      : human-readable shoot title
   meta       : one line of context (location, dates, etc.)
   url        : link to the shoot's own review site (relative to /shoots/)
   status     : short label, e.g. "In review", "Selects locked", "Archived"
   ============================================================ */
const SHOOTS = [
  {
    brand: "Burrow",
    accent: "#94944D",
    code: "26JUL BUR CHI",
    title: "Artist's Loft — Chicago",
    meta: "Lifestyle + product · Chicago, IL · July 2026",
    url: "../",
    status: "In review"
  }
];

function render(){
  const wrap = document.getElementById('wrap');
  if(SHOOTS.length === 0){
    wrap.innerHTML = '<div class="emptyNote">No shoots added yet.</div>';
    return;
  }
  const groups = {};
  SHOOTS.forEach(s=>{
    (groups[s.brand] = groups[s.brand] || []).push(s);
  });

  wrap.innerHTML = Object.keys(groups).map(brand=>{
    const items = groups[brand];
    return `
      <div class="brandGroup">
        <div class="brandLabel">
          <span class="brandDot" style="background:${items[0].accent}"></span>
          <h2>${brand}</h2>
        </div>
        <div class="cards">
          ${items.map(s=>`
            <a class="card" href="${s.url}" style="--accent:${s.accent}">
              <div class="code mono">${s.code}</div>
              <h3>${s.title}</h3>
              <div class="meta">${s.meta}</div>
              <div class="foot">
                <span>${s.status}</span>
                <span class="open">Open</span>
              </div>
            </a>
          `).join('')}
        </div>
      </div>
    `;
  }).join('');
}

// film-leader tick marks across the masthead
(function(){
  const el = document.getElementById('ticks');
  const n = 40;
  el.innerHTML = Array.from({length:n}, ()=>'<span></span>').join('');
  el.style.padding = '10px 18px';
})();

render();
</script>
</body>
</html>
