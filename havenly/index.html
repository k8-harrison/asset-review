<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Havenly — Asset Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Playfair+Display:wght@500;600;700&family=Lora:wght@500;600;700&family=Source+Serif+4:wght@500;600;700&family=Space+Grotesk:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&family=Overpass:wght@400;500;600&family=Inter:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F2EEE3; --ink:#211F1A; --ink-soft:#6E6A5E; --line:#DCD6C7; --accent:#B8583A;
    --font-headline:'Fraunces',serif; --font-body:'Overpass',sans-serif;
    --wrap-pad:56px 28px 100px; --row-pad:20px 0;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:var(--font-body);}
  a{color:inherit;text-decoration:none;}
  .wrap{max-width:640px;margin:0 auto;padding:var(--wrap-pad);}
  .crumb{font-size:13px;color:var(--ink-soft);margin:0 0 22px;}
  .crumb a{border-bottom:1px solid var(--line);}
  .crumb a:hover{border-color:var(--ink-soft);}
  .titleRow{display:flex;align-items:center;gap:12px;margin:0 0 40px;}
  .chip{width:13px;height:13px;border-radius:50%;background:var(--accent);flex:none;}
  h1{font-family:var(--font-headline);font-weight:500;font-size:38px;line-height:1.05;letter-spacing:-0.01em;margin:0;}
  .lede{font-size:15px;color:var(--ink-soft);line-height:1.6;max-width:42ch;margin:14px 0 48px;padding-left:25px;}

  .projects{display:flex;flex-direction:column;}
  .project{display:flex;align-items:baseline;gap:16px;padding:var(--row-pad);border-top:1px solid var(--line);}
  .projects .project:last-child{border-bottom:1px solid var(--line);}
  .project-main{flex:1;min-width:0;}
  .project-code{font-size:12px;color:var(--accent);font-weight:600;margin-bottom:2px;}
  .project-name{font-family:var(--font-headline);font-weight:500;font-size:20px;}
  .project:hover .project-name{opacity:0.6;}
  .project-desc{font-size:13px;color:var(--ink-soft);margin-top:3px;}
  .project-status{font-size:13px;color:var(--ink);white-space:nowrap;flex:none;}

  .emptyState{
    padding:28px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);
    font-size:14px;color:var(--ink-soft);
  }

  @media (max-width:480px){
    .wrap{padding:40px 20px 70px;}
    h1{font-size:30px;}
    .lede{padding-left:0;}
    .project{flex-wrap:wrap;}
    .project-status{width:100%;}
  }
  [data-accent="bar"] .chip{border-radius:2px;width:4px;height:22px;transform:translateY(0);align-self:stretch;}
  [data-accent="none"] .chip{display:none;}
</style>
</head>
<body>
<script>
/* ===== Site-wide look, controlled from /admin/ ===== */
const BRAND_SLUG = 'havenly';
const THEME_DEFAULTS = {
  paper: '#F2EEE3', ink: '#211F1A', inkSoft: '#6E6A5E', line: '#DCD6C7',
  headlineFont: 'fraunces', bodyFont: 'overpass',
  density: 'comfortable', accentStyle: 'dot'
};
const HEADLINE_FONT_MAP = {
  fraunces: "'Fraunces', serif", playfair: "'Playfair Display', serif",
  lora: "'Lora', serif", sourceserif: "'Source Serif 4', serif",
  spacegrotesk: "'Space Grotesk', sans-serif", worksans: "'Work Sans', sans-serif"
};
const BODY_FONT_MAP = {
  overpass: "'Overpass', sans-serif", inter: "'Inter', sans-serif",
  worksans: "'Work Sans', sans-serif", plexsans: "'IBM Plex Sans', sans-serif",
  sourcesans: "'Source Sans 3', sans-serif"
};
const DENSITY_MAP = {
  compact:     { wrapPad: '40px 24px 60px',  rowPad: '14px 0' },
  comfortable: { wrapPad: '56px 28px 100px', rowPad: '20px 0' },
  spacious:    { wrapPad: '80px 32px 140px', rowPad: '28px 0' }
};
function applyTheme(theme){
  const t = Object.assign({}, THEME_DEFAULTS, theme || {});
  const root = document.documentElement.style;
  root.setProperty('--paper', t.paper);
  root.setProperty('--ink', t.ink);
  root.setProperty('--ink-soft', t.inkSoft);
  root.setProperty('--line', t.line);
  root.setProperty('--font-headline', HEADLINE_FONT_MAP[t.headlineFont] || HEADLINE_FONT_MAP.fraunces);
  root.setProperty('--font-body', BODY_FONT_MAP[t.bodyFont] || BODY_FONT_MAP.overpass);
  const d = DENSITY_MAP[t.density] || DENSITY_MAP.comfortable;
  root.setProperty('--wrap-pad', d.wrapPad);
  root.setProperty('--row-pad', d.rowPad);
  if(t.brandAccents && t.brandAccents[BRAND_SLUG]){
    root.setProperty('--accent', t.brandAccents[BRAND_SLUG]);
  }
  if(document.body) document.body.setAttribute('data-accent', t.accentStyle || 'dot');
}
(async function(){
  let theme = null;
  let fetchNote = '';
  try{
    const res = await fetch('https://asset-review-8bfb6-default-rtdb.firebaseio.com/theme.json', {cache:'no-store'});
    if(res.ok){
      theme = await res.json();
    } else {
      const body = await res.text().catch(()=>'');
      fetchNote = 'Could not load saved site settings (HTTP ' + res.status + ') — showing defaults.' + (body ? ' ' + body.slice(0,200) : '');
    }
  }catch(e){
    fetchNote = 'Could not load saved site settings (' + (e.message || 'network error') + ') — showing defaults.';
  }
  applyTheme(theme);
  if(fetchNote){
    const appendNote = ()=>{
      const note = document.createElement('div');
      note.style.cssText = 'margin-top:14px;font-size:11.5px;color:#B3261E;max-width:44ch;';
      note.textContent = fetchNote;
      const wrap = document.querySelector('.wrap');
      if(wrap) wrap.appendChild(note);
    };
    if(document.readyState === 'loading'){
      document.addEventListener('DOMContentLoaded', appendNote);
    } else {
      appendNote();
    }
    console.error('[theme]', fetchNote);
  }
})();
</script>
<div class="wrap">
  <div class="crumb"><a href="../">Asset Review</a> / Havenly</div>
  <div class="titleRow">
    <span class="chip"></span>
    <h1>Havenly</h1>
  </div>
  <div class="projects">
    <a class="project" href="26jun-hav/">
      <span class="project-main">
        <div class="project-code">26JUN HAV</div>
        <div class="project-name">June Shoot</div>
        <div class="project-desc">Shot in June 2026, across Main, Messy, Leica, and Talent batches.</div>
      </span>
      <span class="project-status">In review</span>
    </a>
  </div>
</div>
</body>
</html>
