<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Havenly Brands — Asset Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Overpass:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F2EEE3;
    --ink:#211F1A;
    --ink-soft:#6E6A5E;
    --line:#DCD6C7;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:'Overpass',sans-serif;}
  a{color:inherit;text-decoration:none;}

  .wrap{max-width:640px;margin:0 auto;padding:72px 28px 100px;}

  .kicker{font-size:14px;color:var(--ink-soft);margin:0 0 6px;}
  h1{
    font-family:'Fraunces',serif;font-weight:500;font-size:44px;line-height:1.05;
    letter-spacing:-0.01em;margin:0 0 18px;
  }
  .lede{font-size:15.5px;color:var(--ink-soft);line-height:1.6;max-width:38ch;margin:0 0 56px;}

  .brands{display:flex;flex-direction:column;}

  .brand{
    display:flex;align-items:baseline;gap:16px;padding:22px 0;
    border-top:1px solid var(--line);
  }
  .brands .brand:last-child{border-bottom:1px solid var(--line);}

  .chip{
    width:11px;height:11px;border-radius:50%;background:var(--accent);
    flex:none;transform:translateY(-2px);
  }
  .brand-main{flex:1;min-width:0;}
  .brand-name{
    font-family:'Fraunces',serif;font-weight:500;font-size:24px;letter-spacing:-0.005em;
  }
  .brand a.brand-name-link{transition:opacity .12s;}
  .brand:hover .brand-name-link{opacity:0.6;}
  .brand-desc{font-size:13.5px;color:var(--ink-soft);margin-top:3px;}

  .brand-status{
    font-size:13px;color:var(--ink-soft);white-space:nowrap;text-align:right;flex:none;
  }
  .brand-status.live{color:var(--ink);}

  @media (max-width:480px){
    .wrap{padding:48px 20px 70px;}
    h1{font-size:34px;}
    .brand{flex-wrap:wrap;}
    .brand-status{width:100%;text-align:left;margin-top:4px;padding-left:27px;}
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="kicker">Havenly Brands</div>
  <h1>Asset Review</h1>
  <p class="lede">Photo and file review for every brand's shoots — pick a brand, then a project, then a round.</p>

  <div class="brands" id="brands"></div>
</div>

<script>
/* ============================================================
   BRANDS — add a new brand by adding one object here, and
   creating a matching /<slug>/index.html project directory.
   ============================================================ */
const BRANDS = [
  { name: "Havenly", slug: "havenly", accent: "#B8583A", desc: "Interior design service & home marketplace", active: 1 },
  { name: "Interior Define", slug: "interior-define", accent: "#33475A", desc: "Custom furniture", active: 0 },
  { name: "The Citizenry", slug: "the-citizenry", accent: "#C08A2E", desc: "Global artisan-made home goods", active: 0 },
  { name: "Burrow", slug: "burrow", accent: "#8B8B4A", desc: "Modern furniture", active: 1 },
  { name: "The Expert", slug: "the-expert", accent: "#5C3A52", desc: "Curated design marketplace & editorial", active: 0 }
];

function render(){
  document.getElementById('brands').innerHTML = BRANDS.map(b=>{
    const statusText = b.active === 0 ? 'No active projects' : (b.active + ' project in review');
    return `
    <a class="brand" href="${b.slug}/" style="--accent:${b.accent}">
      <span class="chip"></span>
      <span class="brand-main">
        <span class="brand-name brand-name-link">${b.name}</span>
        <div class="brand-desc">${b.desc}</div>
      </span>
      <span class="brand-status ${b.active > 0 ? 'live' : ''}">${statusText}</span>
    </a>`;
  }).join('');
}
render();
</script>

</body>
</html>
