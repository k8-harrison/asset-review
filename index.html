<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Havenly Brands — Asset Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Playfair+Display:wght@500;600;700&family=Lora:wght@500;600;700&family=Source+Serif+4:wght@500;600;700&family=Space+Grotesk:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&family=Overpass:wght@400;500;600&family=Inter:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F2EEE3;
    --ink:#211F1A;
    --ink-soft:#6E6A5E;
    --line:#DCD6C7;
    --font-headline:'Fraunces',serif; --font-body:'Overpass',sans-serif;
    --wrap-pad:56px 28px 100px; --row-pad:20px 0;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:var(--font-body);}
  a{color:inherit;text-decoration:none;}

  .wrap{max-width:640px;margin:0 auto;padding:var(--wrap-pad);}

  .kicker{font-size:14px;color:var(--ink-soft);margin:0 0 6px;}
  h1{
    font-family:var(--font-headline);font-weight:500;font-size:44px;line-height:1.05;
    letter-spacing:-0.01em;margin:0 0 18px;
  }
  .lede{font-size:15.5px;color:var(--ink-soft);line-height:1.6;max-width:38ch;margin:0 0 56px;}

  .brands{display:flex;flex-direction:column;}

  .brand{
    display:flex;align-items:baseline;gap:16px;padding:var(--row-pad);
    border-top:1px solid var(--line);
  }
  .brands .brand:last-child{border-bottom:1px solid var(--line);}

  .chip{
    width:11px;height:11px;border-radius:50%;background:var(--accent);
    flex:none;transform:translateY(-2px);
  }
  .brand-main{flex:1;min-width:0;}
  .brand-name{
    font-family:var(--font-headline);font-weight:500;font-size:24px;letter-spacing:-0.005em;
  }
  .brand a.brand-name-link{transition:opacity .12s;}
  .brand:hover .brand-name-link{opacity:0.6;}
  .brand-desc{font-size:13.5px;color:var(--ink-soft);margin-top:3px;}

  .brand-status{
    font-size:13px;color:var(--ink-soft);white-space:nowrap;text-align:right;flex:none;
  }
  .brand-status.live{color:var(--ink);}

  @media (max-width:480px){
    .wrap{padding:48px 20px 70px;}
    h1{font-size:34px;}
    .brand{flex-wrap:wrap;}
    .brand-status{width:100%;text-align:left;margin-top:4px;padding-left:27px;}
  }
  [data-accent="bar"] .chip{border-radius:2px;width:4px;height:22px;transform:translateY(0);align-self:stretch;}
  [data-accent="none"] .chip{display:none;}
</style>
</head>
<body>
<script>
/* ===== Site-wide look, controlled from /admin/ ===== */
const THEME_DEFAULTS = {
  paper: '#F2EEE3', ink: '#211F1A', inkSoft: '#6E6A5E', line: '#DCD6C7',
  headlineFont: 'fraunces', bodyFont: 'overpass',
  density: 'comfortable', accentStyle: 'dot'
};
const HEADLINE_FONT_MAP = {
  fraunces: "'Fraunces', serif", playfair: "'Playfair Display', serif",
  lora: "'Lora', serif", sourceserif: "'Source Serif 4', serif",
  spacegrotesk: "'Space Grotesk', sans-serif", worksans: "'Work Sans', sans-serif"
};
const BODY_FONT_MAP = {
  overpass: "'Overpass', sans-serif", inter: "'Inter', sans-serif",
  worksans: "'Work Sans', sans-serif", plexsans: "'IBM Plex Sans', sans-serif",
  sourcesans: "'Source Sans 3', sans-serif"
};
const DENSITY_MAP = {
  compact:     { wrapPad: '40px 24px 60px',  rowPad: '14px 0' },
  comfortable: { wrapPad: '56px 28px 100px', rowPad: '20px 0' },
  spacious:    { wrapPad: '80px 32px 140px', rowPad: '28px 0' }
};
function applyTheme(theme){
  const t = Object.assign({}, THEME_DEFAULTS, theme || {});
  const root = document.documentElement.style;
  root.setProperty('--paper', t.paper);
  root.setProperty('--ink', t.ink);
  root.setProperty('--ink-soft', t.inkSoft);
  root.setProperty('--line', t.line);
  root.setProperty('--font-headline', HEADLINE_FONT_MAP[t.headlineFont] || HEADLINE_FONT_MAP.fraunces);
  root.setProperty('--font-body', BODY_FONT_MAP[t.bodyFont] || BODY_FONT_MAP.overpass);
  const d = DENSITY_MAP[t.density] || DENSITY_MAP.comfortable;
  root.setProperty('--wrap-pad', d.wrapPad);
  root.setProperty('--row-pad', d.rowPad);
  if(document.body) document.body.setAttribute('data-accent', t.accentStyle || 'dot');
  return t;
}
</script>

<div class="wrap">
  <div class="kicker">Havenly Brands</div>
  <h1>Asset Review</h1>
  <p class="lede">Photo and file review for every brand's shoots — pick a brand, then a project, then a round.</p>

  <div class="brands" id="brands"></div>

  <div style="margin-top:40px;">
    <a href="admin/" style="font-size:12.5px;color:var(--ink-soft);border-bottom:1px solid var(--line);">Site settings</a>
  </div>
</div>

<script>
/* ============================================================
   BRANDS — add a new brand by adding one object here, and
   creating a matching /<slug>/index.html project directory.
   'accent' here is only the fallback shown before /admin/'s
   saved brandAccents load (or if none have been saved yet).
   ============================================================ */
const BRANDS = [
  { name: "Havenly", slug: "havenly", accent: "#B8583A", desc: "Interior design service & home marketplace", active: 1 },
  { name: "Interior Define", slug: "interior-define", accent: "#33475A", desc: "Custom furniture", active: 0 },
  { name: "The Citizenry", slug: "the-citizenry", accent: "#C08A2E", desc: "Global artisan-made home goods", active: 0 },
  { name: "Burrow", slug: "burrow", accent: "#8B8B4A", desc: "Modern furniture", active: 1 },
  { name: "The Expert", slug: "the-expert", accent: "#5C3A52", desc: "Curated design marketplace & editorial", active: 0 }
];

function render(brandAccents){
  const accents = brandAccents || {};
  document.getElementById('brands').innerHTML = BRANDS.map(b=>{
    const statusText = b.active === 0 ? 'No active projects' : (b.active + ' project in review');
    const accent = accents[b.slug] || b.accent;
    return `
    <a class="brand" href="${b.slug}/" style="--accent:${accent}">
      <span class="chip"></span>
      <span class="brand-main">
        <span class="brand-name brand-name-link">${b.name}</span>
        <div class="brand-desc">${b.desc}</div>
      </span>
      <span class="brand-status ${b.active > 0 ? 'live' : ''}">${statusText}</span>
    </a>`;
  }).join('');
}

(async function(){
  let theme = null;
  try{
    const res = await fetch('https://asset-review-8bfb6-default-rtdb.firebaseio.com/theme.json', {cache:'no-store'});
    theme = res.ok ? await res.json() : null;
  }catch(e){ /* fall back to defaults below */ }
  const applied = applyTheme(theme);
  render(applied.brandAccents);
})();
</script>

</body>
</html>
